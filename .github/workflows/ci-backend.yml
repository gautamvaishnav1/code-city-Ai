name: CI - Backend Tests

on:
  push:
    branches: [main, develop]
    paths: ['Backend/**', '.github/workflows/ci-backend.yml']
  pull_request:
    branches: [main]
    paths: ['Backend/**']

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # the repo declares engines.node >= 18, but vitest 3 / mongoose 9 and
        # friends are only exercised on the versions we actually support in CI
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      # the directory is `Backend` (capital B) — `./backend` does not exist on
      # a case-sensitive runner and every step failed before it started
      - working-directory: ./Backend
        run: npm install
      - working-directory: ./Backend
        run: npm run typecheck
      - working-directory: ./Backend
        run: npm test
      - working-directory: ./Backend
        run: npm run build
